x-php-common: &php-common
  restart: unless-stopped
  volumes:
    - ./projects:/var/www
  networks:
    - dev
  user: "${UID}:${GID}"
  environment:
    HOME: /var/www
    COMPOSER_HOME: /var/www/.composer
    COMPOSER_CACHE_DIR: /var/www/.composer-cache
    COMPOSER_PROCESS_TIMEOUT: 600
    COMPOSER_REPOSITORY: ${COMPOSER_REPOSITORY}
    PSYSH_CONFIG_DIR: /var/www/.psysh
    XDG_CONFIG_HOME: /var/www/.config
    XDG_DATA_HOME: /var/www/.local/share

services:
  php82:
    <<: *php-common
    profiles:
      - php82
    image: ${DOCKAVEL_RUNTIME_PREFIX}dockavel-php:8.2
    container_name: dockavel-php82
    networks:
      dev:
        aliases:
          - php

  php83:
    <<: *php-common
    profiles:
      - php83
    image: ${DOCKAVEL_RUNTIME_PREFIX}dockavel-php:8.3
    container_name: dockavel-php83

  php84:
    <<: *php-common
    profiles:
      - php84
    image: ${DOCKAVEL_RUNTIME_PREFIX}dockavel-php:8.4
    container_name: dockavel-php84

  php85:
    <<: *php-common
    profiles:
      - php85
    image: ${DOCKAVEL_RUNTIME_PREFIX}dockavel-php:8.5
    container_name: dockavel-php85

  node:
    profiles:
      - node
    image: ${DOCKAVEL_RUNTIME_PREFIX}dockavel-node:24
    container_name: dockavel-node
    restart: unless-stopped
    init: true
    user: "${UID}:${GID}"
    working_dir: /var/www
    volumes:
      - ./projects:/var/www
      - ./supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
      - ./supervisor/conf.d:/etc/supervisor/conf.d:ro
    networks:
      - dev
    environment:
      HOME: /var/www
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY}
      npm_config_registry: ${NPM_REGISTRY}
      NPM_CONFIG_STRICT_SSL: ${NPM_STRICT_SSL}
      NPM_CONFIG_CACHE: /var/www/.npm-cache
      NPM_CONFIG_FETCH_RETRIES: "20"
      NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "180000"
      NPM_CONFIG_FETCH_TIMEOUT: "600000"
      NPM_CONFIG_MAXSOCKETS: "2"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    expose:
      - "3000-3099"

  redis:
    profiles:
      - redis
    image: ${DOCKER_LIBRARY_PREFIX}redis:7-alpine
    container_name: dockavel-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    networks:
      - dev

  mysql:
    profiles:
      - mysql
    image: ${DOCKER_LIBRARY_PREFIX}mysql:8.0
    container_name: dockavel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dev

  postgres:
    profiles:
      - postgres
    image: ${DOCKER_LIBRARY_PREFIX}postgres:17-alpine
    container_name: dockavel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev

  phpmyadmin:
    profiles:
      - mysql-ui
    image: ${DOCKER_NAMESPACE_PREFIX}phpmyadmin/phpmyadmin
    container_name: dockavel-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-18080}:80"
    depends_on:
      - mysql
    networks:
      - dev

  pgadmin:
    profiles:
      - postgres-ui
    image: ${DOCKER_NAMESPACE_PREFIX}dpage/pgadmin4:9
    container_name: dockavel-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-18081}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dev

  nginx:
    image: ${DOCKER_LIBRARY_PREFIX}nginx:alpine
    container_name: dockavel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./projects:/var/www:ro
    networks:
      - dev

networks:
  dev:

volumes:
  mysql_data:
  postgres_data:
  pgadmin_data:
