name: Publish Runtime Images

on:
  push:
    branches:
      - main
      - feature/configurable-stack
    paths:
      - Dockerfile
      - Dockerfile-node
      - docker/php/entrypoint.sh
      - .github/workflows/publish-images.yml

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  php:
    name: Publish PHP ${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image namespace
        id: vars
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/dockavel-php:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Dockavel PHP ${{ matrix.version }} development runtime
          cache-from: type=gha,scope=php-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.version }}

  node:
    name: Publish Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image namespace
        id: vars
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Node runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-node
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/dockavel-node:24
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Dockavel Node.js 24 development runtime
          cache-from: type=gha,scope=node-24
          cache-to: type=gha,mode=max,scope=node-24
