name: Publish Runtime Images

on:
  push:
    branches:
      - main
      - feature/configurable-stack
    paths:
      - Dockerfile
      - Dockerfile-node
      - docker/php/entrypoint.sh
      - .github/workflows/publish-images.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: Publish PHP ${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Docker Hub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi
          if [[ "${DOCKERHUB_USERNAME,,}" != "afshinefati" ]]; then
            echo "DOCKERHUB_USERNAME must be afshinefati because Dockavel runtime presets use that public namespace."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
          tags: afshinefati/dockavel-php:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Dockavel PHP ${{ matrix.version }} development runtime
          cache-from: type=gha,scope=php-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.version }}

  node:
    name: Publish Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Docker Hub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi
          if [[ "${DOCKERHUB_USERNAME,,}" != "afshinefati" ]]; then
            echo "DOCKERHUB_USERNAME must be afshinefati because Dockavel runtime presets use that public namespace."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Node runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-node
          push: true
          tags: afshinefati/dockavel-node:24
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Dockavel Node.js 24 development runtime
          cache-from: type=gha,scope=node-24
          cache-to: type=gha,mode=max,scope=node-24
