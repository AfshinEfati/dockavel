name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  compose-validation:
    name: Validate Compose (${{ matrix.profiles }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        profiles:
          - php82,mysql,redis
          - php85,postgres,redis,node
          - php82,php83,php84,php85,mysql,postgres,redis,node,mysql-ui,postgres-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: COMPOSE_PROFILES="${{ matrix.profiles }}" docker compose config

  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: php82
            profile: php82
          - service: php83
            profile: php83
          - service: php84
            profile: php84
          - service: php85
            profile: php85
          - service: node
            profile: node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build ${{ matrix.service }}
        run: docker compose --profile "${{ matrix.profile }}" build --pull "${{ matrix.service }}"
