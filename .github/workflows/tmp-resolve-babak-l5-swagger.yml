name: Temporary Babak L5 Swagger Resolver

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resolver branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:2.10.2
          coverage: none

      - name: Resolve dependencies
        working-directory: .tmp/babak-l5-swagger
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/babak-l5-swagger/composer.lock
          git commit -m "tmp: resolve babak L5 Swagger lock"
          git push origin HEAD:${{ github.head_ref }}
