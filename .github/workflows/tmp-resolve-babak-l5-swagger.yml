name: Temporary Babak L5 Swagger Resolver

on:
  push:
    branches:
      - agent/tmp-babak-l5-swagger-lock

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resolver branch
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:2.10.2
          coverage: none

      - name: Resolve dependencies
        working-directory: .tmp/babak-l5-swagger
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Create compact transfer copy
        run: |
          php -r '$data = json_decode(file_get_contents(".tmp/babak-l5-swagger/composer.lock"), true, 512, JSON_THROW_ON_ERROR); file_put_contents(".tmp/babak-l5-swagger/composer.lock.min.json", json_encode($data, JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE));'

      - name: Commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/babak-l5-swagger/composer.lock .tmp/babak-l5-swagger/composer.lock.min.json
          if git diff --cached --quiet; then
            echo "Lock files are unchanged."
            exit 0
          fi
          git commit -m "tmp: resolve babak L5 Swagger lock"
          git push
